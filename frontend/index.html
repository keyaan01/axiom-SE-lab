<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axiom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            // Build 7 — Axiom Sugar theme: point the palette the app already
            // uses (ink/paper + Tailwind's neutral/red/amber/emerald/white) at
            // our CSS custom properties (frontend/css/theme.css) so nearly
            // every existing utility class themes for free in light + dark,
            // with no markup churn. See DESIGN.md §2 and §6.
            ink: 'var(--text)',
            paper: 'var(--bg)',
            primary: 'var(--primary)',
            grape: 'var(--primary)',
            mint: 'var(--mint)',
            peach: 'var(--peach)',
            sky: 'var(--sky)',
            lilac: 'var(--lilac)',
            lemon: 'var(--lemon)',
            white: 'var(--surface)',
            neutral: {
              50: 'var(--surface-2)',
              100: 'var(--surface-3)',
              200: 'var(--border)',
              300: 'var(--border-strong)',
              400: 'var(--text-subtle)',
              500: 'var(--text-subtle)',
              600: 'var(--text-muted)',
              700: 'var(--text-muted)',
              800: 'var(--text)',
              900: 'var(--text)',
            },
            red: {
              50: 'var(--danger-c)',
              100: 'var(--danger-c)',
              200: 'var(--danger)',
              300: 'var(--danger)',
              500: 'var(--danger)',
              600: 'var(--danger)',
              700: 'var(--on-danger-c)',
            },
            amber: {
              50: 'var(--lemon-c)',
              100: 'var(--lemon-c)',
              200: 'var(--warning)',
              400: 'var(--warning)',
              500: 'var(--warning)',
              700: 'var(--on-lemon-c)',
              800: 'var(--on-lemon-c)',
            },
            emerald: {
              50: 'var(--success-c)',
              100: 'var(--success-c)',
              200: 'var(--success)',
              300: 'var(--success)',
              400: 'var(--success)',
              500: 'var(--success)',
              600: 'var(--success)',
              700: 'var(--on-mint-c)',
              800: 'var(--on-mint-c)',
            },
          },
        },
      },
    };
  </script>
  <script>
    // No-flash theme bootstrap: applied synchronously (before first paint) so
    // a reload never flashes the wrong theme. Mirrors applyTheme()/getTheme()
    // in app.js — kept independent here since app.js loads after body content.
    (function () {
      try {
        var t = localStorage.getItem('axiom_theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <!-- jsPDF: used only to export a note WITH the user's reader annotations baked in
       (window.jspdf.jsPDF). If it fails to load, the reader download falls back to the
       clean original PDF. -->
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="/css/theme.css?v=b16" />
  <link rel="stylesheet" href="/css/reader.css?v=b16" />
  <link rel="stylesheet" href="/css/canvas.css?v=b16" />
  <link rel="stylesheet" href="/css/mindmap.css?v=b16" />
  <link rel="stylesheet" href="/css/analysis.css?v=b16" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/web/pdf_viewer.css" />
  <!-- d3 (Build 10 curriculum mind map, REV 2 — minimal/Obsidian graph view):
       forceSimulation/forceLink/forceManyBody/forceCollide/forceX/forceY run
       LIVE (draggable nodes, organic settle), plus quadtree for hit-testing.
       mindmap.js falls back to a static golden-angle layout (no physics/drag)
       if this fails to load (frontend/MINDMAP.md §2). -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script type="module">
    // Immersive PDF reader (custom canvas rebuild): load PDF.js's core
    // library as an ES module and expose it on window so the classic
    // (non-module) app.js can use it — getDocument() to load the file,
    // page.render() to draw each page's canvas up front, and its text-layer
    // API (TextLayer class / renderTextLayer function, whichever this build
    // exposes — probed at runtime in app.js) for selectable text. No viewer
    // *component* (PDFViewer/EventBus/PDFLinkService) is used any more — our
    // own render-every-page-up-front loop replaced it (virtualized on-demand
    // rendering caused a scroll jitter). pdf_viewer.css (linked above) is
    // still needed for the text layer's span/selection styling.
    // app.js's openReader() polls briefly for window.__pdfjs in case this
    // module script hasn't finished loading yet on a slow connection.
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
    // TextLayerBuilder (a viewer component) — NOT the raw TextLayer class: the
    // builder also creates the `.endOfContent` element and wires the `.selecting`
    // drag toggle, which is what constrains native text selection. The raw
    // TextLayer class omits both, which made a partial drag select ALL the text.
    import { TextLayerBuilder } from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/web/pdf_viewer.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';
    window.__pdfjs = { lib: pdfjsLib, TextLayerBuilder };
  </script>
  <style>
    /* Left sidebar nav rows (Build 6, Step 3) — plain CSS rather than Tailwind
       utility classes so the active/hover states are simple to toggle from JS
       (classList.toggle('active', ...)) without juggling long class strings.
       Further-fixes pass: the collapsed and expanded states now differ ONLY in
       animatable properties (max-width/opacity, never `display`; one stable
       justify-content/padding, never a hover-only flip) so everything tweens
       together with #sidebar's width transition below instead of snapping a
       frame ahead of it. */
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: .625rem;
      width: 100%;
      border-radius: 0.6rem;
      border: none;
      background: none;
      padding: 0.6rem 0.625rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25rem;
      color: var(--text-muted);
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    .sidebar-nav-item svg { flex-shrink: 0; }
    /* Fixed-width centered slot for a row's LEADING icon so icons of different
       intrinsic sizes (the 10px health dot, the 28px avatar, the 16px logout
       glyph) all center on the SAME vertical axis as each other and the 18px
       nav icons — instead of left-aligning at the padding and looking staggered
       when collapsed. A larger icon (the avatar) simply center-overflows the
       slot symmetrically (overflow stays visible), keeping its center on-axis. */
    .sidebar-icon-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.125rem;
      flex-shrink: 0;
    }
    /* Label stays in the DOM at all times (never `display:none` — that can't
       animate) and is clipped to zero width instead; #sidebar's own
       overflow:hidden also masks it so nothing peeks out past the icon-only
       collapsed rail. Scoped to :last-child (not every span) — Fix 4 gave the
       health pill and user rows a leading icon/avatar that is ALSO a <span>
       (the status dot; the initials-avatar fallback), and an unscoped `span`
       selector collapsed those to max-width:0 too, making them invisible
       while collapsed. The label is always the last span in every row (nav
       icon+label, dot+label, avatar+label), so :last-child reveals only it. */
    .sidebar-nav-item > span:last-child {
      display: inline-block;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width var(--dur) var(--ease-spring), opacity .15s ease;
    }
    .sidebar-nav-item:hover { background-color: var(--surface-2); color: var(--text); }
    .sidebar-nav-item.active { background-color: var(--surface-2); color: var(--text); }

    /* Build 13c: hover-expand sidebar. #sidebar is a flex child of the
       `.flex.min-h-screen` shell (index.html body), and #view's wrapper is its
       flex-1 sibling — so animating #sidebar's WIDTH reflows #view (and every
       full-bleed view mounted inside it: the canvas shell, the mind-map's
       absolutely-positioned .mm-root panels) rightward for free. No JS, no
       hardcoded content offset anywhere. overflow:hidden lets the growing rail
       clip/reveal labels like a mask instead of them spilling out mid-tween. */
    #sidebar {
      transition: width var(--dur) var(--ease-spring);
      overflow: hidden;
    }
    #sidebar:hover { width: 14rem; }
    /* Labels reveal with a short delay so they fade in as the rail settles
       rather than racing the width tween open (and fade back out immediately,
       no delay, on mouse-away — the base rule above has none). */
    #sidebar:hover .sidebar-nav-item > span:last-child {
      max-width: 10rem;
      opacity: 1;
      transition-delay: .05s;
    }
    /* Accessibility batch, B3: keyboard Tab (focus-within) reveals the same
       labels that :hover does, so a keyboard/touch user tabbing through the
       collapsed rail can see which icon they're on, not just mouse hover. */
    #sidebar:focus-within .sidebar-nav-item > span:last-child {
      max-width: 10rem;
      opacity: 1;
    }
    /* Bottom cluster (health pill + #sidebar-user, built by renderSidebarUser)
       now behaves exactly like the nav rows above (Build 13 FF2, Fix 4):
       #health-pill carries .sidebar-nav-item itself (dot + revealable label),
       and renderSidebarUser() renders two .sidebar-nav-item rows (profile,
       log out) — so everything left-aligns collapsed and reveals its label on
       hover in lockstep with the nav, with no separate centered layout to
       snap out of.  */

    /* Fix 2: on the two full-bleed routes (mind map, canvas) the hover-expand
       rail above PUSHES #view's flex-1 sibling (that's the point on ordinary
       scrollable pages) — but those two views recompute their own internal
       layout from that column's width (mmResize; the canvas board), so they
       visibly resized while the cursor sat over the menu. Scoped to
       body.fullbleed-view (toggled in app.js route()) only — every other page
       keeps today's push behaviour untouched. Takes #sidebar out of flow so
       its width no longer affects the flex layout at all, then offsets the
       content column by the rail's COLLAPSED width so the at-rest look is
       pixel-identical to the in-flow layout; hovering to 14rem then overlays
       the content instead of reflowing it. z-index 45 sits above ordinary
       content but below the reader(55)/pomodoro(60)/auth(70)/modals(75)/
       toasts(80) stack. */
    body.fullbleed-view #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 45;
    }
    body.fullbleed-view #sidebar + div {
      margin-left: 4rem; /* matches the collapsed rail's w-16 */
    }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">

          <span>Settings</span>
        </button>
        <button data-action="go-search" data-nav="search" class="sidebar-nav-item" title="Search (Ctrl/Cmd+K)" aria-label="Search (Ctrl/Cmd+K)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>Search</span>

      </nav>
      <div class="flex-1"></div>
      <div id="sidebar-bottom" class="border-t border-neutral-200 pt-3">

          <span class="sidebar-icon-slot"><span class="h-2.5 w-2.5 shrink-0 rounded-full bg-neutral-300"></span></span><span>Checking…</span>
        </button>
        <!-- G7: compact theme toggle restored to the sidebar (filled by
             renderSidebarThemeToggle() in app.js); the full 3-way control also
